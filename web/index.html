<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parking Lot System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>Parking Lot System</h1>
            <p class="sub">Pick an action, then answer the prompts in the box below the buttons.</p>
        </header>

        <div class="stats" aria-label="Lot summary">
            <div><b id="sTotal">0</b><span>Total spots</span></div>
            <div><b id="sFree" class="free">0</b><span>Free</span></div>
            <div><b id="sOcc" class="occ">0</b><span>Occupied</span></div>
        </div>

        <div id="screen" aria-live="polite"></div>

        <div class="btns">
            <button id="bFloor">🏢 Add floor</button>
            <button id="bSpot">➕ Add spot</button>
            <button id="bPark">🅿️ Park vehicle</button>
            <button id="bUnpark">🎫 Unpark vehicle</button>
            <button id="bStatus">📊 Show occupancy</button>
            <button id="bClear" class="plain">Clear screen</button>
        </div>

        <input id="input" type="text" autocomplete="off" placeholder="Type your answer and press Enter">

        <section id="lot" aria-label="Parking lot map"></section>
    </div>
    <script src="script.js"></script>
</body>
</html>
